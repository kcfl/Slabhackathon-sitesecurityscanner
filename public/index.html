<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Security Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #0b1120; color: #f8fafc; }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#0b1120] to-[#0b1120] flex flex-col items-center pt-16 pb-16 px-6 relative overflow-x-hidden">
    
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <main class="w-full max-w-4xl z-10 flex flex-col items-center">
        <div class="text-center mb-10 w-full">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 text-white shadow-lg shadow-indigo-500/30 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
            </div>
            <h1 class="text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-cyan-300 to-emerald-400">
                Site Security Scanner
            </h1>
            <p class="text-lg text-slate-400 max-w-lg mx-auto">
                Check the public security posture of any website. Analyze HTTPS status, response headers, and third-party scripts.
            </p>
        </div>

        <div class="glass-card w-full rounded-2xl p-6 mb-8 relative overflow-hidden group transition-all duration-300 focus-within:border-indigo-500/50 focus-within:shadow-indigo-500/20">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-cyan-400 to-emerald-400 opacity-70"></div>
            
            <form id="scanForm" class="flex flex-col sm:flex-row gap-4">
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    <input 
                        type="url" 
                        id="urlInput"
                        required
                        placeholder="https://example.com" 
                        class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-lg rounded-xl focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 block pl-12 p-4 transition-colors placeholder-slate-600 outline-none"
                    >
                </div>
                <button 
                    type="submit" 
                    id="scanBtn"
                    class="bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-400 hover:to-cyan-400 text-white font-bold text-lg rounded-xl px-8 py-4 flex items-center justify-center gap-3 transition-all transform hover:-translate-y-0.5 active:translate-y-0 shadow-lg shadow-indigo-500/25 sm:w-auto w-full whitespace-nowrap"
                >
                    <span id="btnText">Analyze Site</span>
                    <div id="loadingSpinner" class="spinner hidden"></div>
                </button>
            </form>
        </div>

        <div id="resultsSection" class="w-full opacity-0 hidden transition-all duration-700 transform translate-y-4">
            <div class="glass-card rounded-2xl p-8 text-center border-t border-t-emerald-500/50">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-200 mb-2">Scan Complete</h2>
                <p class="text-slate-400 mb-6 text-lg" id="targetDisplay">Results for: <span class="text-cyan-400 font-medium" id="urlDisplay">--</span></p>
                
                <!-- Error Display -->
                <div id="errorDisplay" class="hidden bg-rose-500/10 border border-rose-500/30 rounded-xl p-6 text-left">
                    <h3 class="text-rose-400 font-bold mb-2 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        AI Analysis Failed
                    </h3>
                    <p id="errorMessage" class="text-slate-300 text-sm">--</p>
                </div>

                <!-- Analysis Display -->
                <div id="analysisDisplay" class="hidden text-left">
                    <div class="flex flex-col md:flex-row items-center gap-8 mb-8 bg-slate-900/50 rounded-2xl p-8 border border-slate-700/50 shadow-inner">
                        <div class="text-center md:border-r border-slate-700/50 md:pr-8 min-w-[150px]">
                            <span class="block text-sm text-slate-400 uppercase tracking-widest font-bold mb-2">Overall Score</span>
                            <div id="overallScore" class="text-7xl font-black">--</div>
                        </div>
                        <div class="flex-grow">
                            <p id="summaryText" class="text-xl text-slate-200 font-light italic mb-6 leading-relaxed">--</p>
                            <div class="p-4 bg-rose-500/10 border border-rose-500/20 rounded-xl">
                                <span class="text-xs uppercase tracking-widest font-bold text-rose-400 block mb-2 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
                                    Top Priority Fix
                                </span>
                                <span id="topPriorityFix" class="text-base font-semibold text-rose-200">--</span>
                            </div>
                        </div>
                    </div>

                    <h3 class="text-xl font-bold text-slate-200 mb-4 px-2 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        Detailed Findings
                    </h3>
                    <ul id="findingsList" class="space-y-4">
                        <!-- Findings injected here -->
                    </ul>
                    
                    <div id="scriptsContainer" class="hidden mt-10 text-left">
                        <h3 class="text-xl font-bold text-slate-200 mb-4 px-2 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                            External Scripts Detected
                        </h3>
                        <div id="scriptsList" class="flex flex-wrap gap-3 px-2">
                            <!-- Scripts injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function getScoreColor(score) {
            if (score < 40) return 'text-rose-500';
            if (score < 70) return 'text-amber-400';
            return 'text-emerald-400';
        }

        function getSeverityBadge(severity) {
            const styles = {
                'high': 'bg-rose-500/20 text-rose-400 border-rose-500/30',
                'medium': 'bg-amber-400/20 text-amber-300 border-amber-400/30',
                'low': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'
            };
            return `<span class="text-[10px] uppercase tracking-wider font-bold px-2 py-1 rounded-md border ${styles[severity]}">${severity}</span>`;
        }

        document.getElementById('scanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlInput = document.getElementById('urlInput');
            const btn = document.getElementById('scanBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');
            const resultsSection = document.getElementById('resultsSection');
            
            const errorDisplay = document.getElementById('errorDisplay');
            const analysisDisplay = document.getElementById('analysisDisplay');
            
            const url = urlInput.value;

            // Enter loading state
            urlInput.disabled = true;
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.textContent = 'Scanning...';
            spinner.classList.remove('hidden');
            
            resultsSection.classList.remove('opacity-100', 'translate-y-0');
            resultsSection.classList.add('opacity-0', 'translate-y-4');
            
            try {
                let response = null;
                try {
                    response = await fetch('/api/scan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url })
                    });
                } catch(e) {
                    throw new Error("Network error contacting backend API.");
                }
                
                const data = await response.json();
                
                // Fix: Extract the target URL properly from raw_data
                // Our backend returns { raw_data: { targetUrl: "..." }, analysis: { ... } }
                // or { error: "...", raw_data: { targetUrl: "..." } }
                const targetUrl = (data.raw_data && data.raw_data.targetUrl) || url;
                document.getElementById('urlDisplay').textContent = targetUrl;
                
                if (data.error || !data.analysis) {
                    errorDisplay.classList.remove('hidden');
                    analysisDisplay.classList.add('hidden');
                    document.getElementById('errorMessage').textContent = data.error || data.details || JSON.stringify(data);
                } else {
                    errorDisplay.classList.add('hidden');
                    analysisDisplay.classList.remove('hidden');
                    
                    const analysis = data.analysis;
                    
                    const scoreEl = document.getElementById('overallScore');
                    scoreEl.textContent = analysis.overall_score;
                    scoreEl.className = `text-7xl font-black drop-shadow-lg ${getScoreColor(analysis.overall_score)}`;
                    
                    document.getElementById('summaryText').textContent = analysis.summary;
                    document.getElementById('topPriorityFix').textContent = analysis.top_priority_fix;
                    
                    const list = document.getElementById('findingsList');
                    list.innerHTML = analysis.findings.map(f => `
                        <li class="bg-slate-900/50 rounded-xl p-5 border border-slate-700/50 hover:border-slate-500/50 transition-colors shadow-sm">
                            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3 mb-3">
                                <span class="font-bold text-slate-200 text-lg leading-snug">${f.issue}</span>
                                <div class="shrink-0 self-start">${getSeverityBadge(f.severity.toLowerCase())}</div>
                            </div>
                            <p class="text-sm text-slate-400 flex gap-2 pt-3 border-t border-slate-700/30">
                                <span class="shrink-0 text-cyan-400">💡</span> 
                                <span>${f.recommendation}</span>
                            </p>
                        </li>
                    `).join('');
                    
                    const scriptsContainer = document.getElementById('scriptsContainer');
                    const scriptsList = document.getElementById('scriptsList');
                    if (data.raw_data && data.raw_data.third_party_scripts && data.raw_data.third_party_scripts.length > 0) {
                        scriptsList.innerHTML = data.raw_data.third_party_scripts.map(s => 
                            `<span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 shadow-sm transition-colors hover:bg-indigo-500/20"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>${s.domain}</span>`
                        ).join('');
                        scriptsContainer.classList.remove('hidden');
                    } else {
                        scriptsContainer.classList.add('hidden');
                    }
                }
                
                resultsSection.classList.remove('hidden');
                void resultsSection.offsetWidth;
                resultsSection.classList.remove('opacity-0', 'translate-y-4');
                resultsSection.classList.add('opacity-100', 'translate-y-0');
                
            } catch (err) {
                console.error(err);
                alert('An error occurred: ' + err.message);
            } finally {
                urlInput.disabled = false;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.textContent = 'Analyze Site';
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
